
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | Adega Delivery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Adega Delivery</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="admin.html">Administração</a>
        </nav>
    </header>

    <main>
        <h2>Cadastro de produtos</h2>

        <form id="form-produto">

            <label for="nome">Nome do produto:</label>
            <input type="text" id="nome" required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" required>
                <option value="">Selecione uma categoria</option>
                <option value="Vodka">Vodka</option>
                <option value="Whisky">Whisky</option>
                <option value="Gin">Gin</option>
                <option value="Energético">Energético</option>
            </select>

            <label for="volume">Volume:</label>
            <input type="text" id="volume" placeholder="Ex: 1L" required>

            <label for="preco">Preço:</label>
            <input type="number" id="preco" step="0.01" min="0" required>

            <label for="estoque">Quantidade em estoque:</label>
            <input type="number" id="estoque" min="0" required>

            <label for="imagem">Link da imagem:</label>
            <input type="url" id="imagem" placeholder="https://..." required>

            <label for="descricao">Descrição:</label>
            <textarea id="descricao" required></textarea>

            <button type="submit">Cadastrar produto</button>

        </form>

        <div id="form-edicao" style="display: none;">

    <h2>Editar produto</h2>

    <form id="form-editar">

        <input type="hidden" id="editar-id">

        <label for="editar-nome">Nome:</label>
        <input type="text" id="editar-nome" required>

        <label for="editar-categoria">Categoria:</label>
        <select id="editar-categoria" required>
            <option value="Vodka">Vodka</option>
            <option value="Whisky">Whisky</option>
            <option value="Gin">Gin</option>
            <option value="Energético">Energético</option>
        </select>

        <label for="editar-volume">Volume:</label>
        <input type="text" id="editar-volume" required>

        <label for="editar-preco">Preço:</label>
        <input type="number" id="editar-preco" step="0.01" min="0" required>

        <label for="editar-estoque">Estoque:</label>
        <input type="number" id="editar-estoque" min="0" required>

        <label for="editar-imagem">Link da imagem:</label>
        <input type="url" id="editar-imagem" required>

        <label for="editar-descricao">Descrição:</label>
        <textarea id="editar-descricao" required></textarea>

        <button type="submit">Salvar alterações</button>
        <button type="button" id="cancelar-edicao">Cancelar</button>

    </form>

</div>
        <h2>Produtos cadastrados</h2>

<section id="lista-admin">
    <p>Carregando produtos...</p>
</section>
    </main>

    <footer>
        <p>Adega Delivery - Todos os direitos reservados.</p>
    </footer>

    <script src="admin.js"></script>

</body>
</html>
